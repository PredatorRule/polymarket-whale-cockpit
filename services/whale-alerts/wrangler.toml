name = "whale-alerts"
main = "src/index.ts"
compatibility_date = "2026-09-11"

# Poll for new whale trades every 2 minutes. One KV put/run (high-water-mark),
# so ~720 puts/day — safely under the free-tier 1000/day limit.
[triggers]
crons = ["*/2 * * * *"]

# Non-secret defaults. Secrets are set separately (NEVER committed):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
[vars]
# Comma-separated wallets to monitor. Leave empty to track GLOBAL large trades
# across the whole platform (the real "whale movement" feed).
WATCH_WALLETS = ""
# Public cockpit origin for the "Audit this wallet" button in each alert.
COCKPIT_URL = "https://polymarket-whale-cockpit.pages.dev"
# Only alert on trades at or above this USD notional.
MIN_NOTIONAL_USD = "5000"
# Lookback window (minutes) each run scans for new trades. Comfortably larger
# than the 2-minute cron so nothing slips between runs.
LOOKBACK_MINUTES = "10"
# Max Telegram messages per run (rate-limit guard; cap 20).
MAX_ALERTS_PER_RUN = "8"

# Persistent dedupe state so the same trade is never alerted twice.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "086ab9064f3c4d649a392b83c86d76bf"

[observability]
enabled = true
